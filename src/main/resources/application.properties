server.port=8081
spring.application.name=notification-hub
app.greeting=Hello from default profile

# H2 in-memory DB
spring.datasource.url=jdbc:h2:mem:notificationhub
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console: в Spring Boot 4 (4.0.8) web console не работает (Boot убрал автоконфиг).
# Оставлено закомментированным на случай ручной регистрации через ServletRegistrationBean.
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
